name: Android Build

on:
  push:
    branches:
      - "arena/01a0a94d-trd"
      - "main"
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APKs and run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools" || true
          else
            echo "sdkmanager not found; AGP will download what it needs."
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests + debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Release APK (signed with debug key when no keystore secret is set)
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: meelano-trader-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: meelano-trader-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      # Best effort: the development sandbox cannot reach the Actions artifact
      # hosts, so mirror the built APKs into the repo (deliver/apk) to hand them
      # over. Skipped silently when the workflow token lacks write permission.
      - name: Mirror APKs into deliver/apk (best effort)
        if: success()
        continue-on-error: true
        working-directory: android
        run: |
          cd "${GITHUB_WORKSPACE}"
          git config user.name "meelano-ci"
          git config user.email "ci@users.noreply.github.com"
          mkdir -p deliver/apk
          cp android/app/build/outputs/apk/debug/app-debug.apk deliver/apk/meelano-trader-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk deliver/apk/meelano-trader-release.apk
          sha256sum deliver/apk/*.apk | tee deliver/apk/SHA256SUMS.txt
          git add -f deliver/apk
          git commit -m "ci: publish built APKs for delivery [skip ci]" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}" || exit 0
