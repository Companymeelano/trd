plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.meelano.trader'
    compileSdk 34

    defaultConfig {
        applicationId "ir.meelano.trader"
        minSdk 21
        targetSdk 34
        versionCode 5
        versionName "5.0.0"
        resConfigs "fa", "en"
    }

    buildTypes {
        debug {
            // APK دیباگ با کلید دیباگ امضا می‌شود و مستقیم قابل نصب است
            applicationIdSuffix ""
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // برای انتشار رسمی یک signingConfig با keystore خودتان اضافه کنید:
            // signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*']
        }
    }
}

// بدون وابستگی خارجی — فقط WebView خودِ اندروید
